name: Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Build platform'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - win
          - mac
          - linux
          - android
  push:
    tags:
      - 'v*'

permissions:
  actions: write
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="v$(jq -r '.version' package.json)"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  cleanup-artifacts:
    needs: meta
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}

    steps:
      - name: Calculate cutoff time
        id: cleanup
        run: |
          echo "cutoff_ts=$(date -u -d '7 days ago' +%s)" >> "$GITHUB_OUTPUT"

      - name: Cleanup old artifacts
        run: |
          CUTOFF=${{ steps.cleanup.outputs.cutoff_ts }}

          gh api "repos/$REPO/actions/artifacts" --paginate \
            --jq "
              .artifacts[]
              | select(
                  (.name | startswith(\"binary\"))
                  or (.name == \"mcpb\")
                  or (.name == \"models\")
                  or (.name == \"public\")
                )
              | select((.created_at | fromdateiso8601) < $CUTOFF)
              | .id
            " |
          xargs -r -I {} sh -c '
            echo "Deleting artifact {}"
            gh api "repos/$REPO/actions/artifacts/{}" -X DELETE || true
          '

  build:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'

      - name: Install dependencies
        run: bun install

      - name: Set version
        shell: bash
        run: npm version "${{ needs.meta.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build binaries
        shell: bash
        run: |
          PLATFORM="${{ github.event_name == 'push' && 'all' || inputs.platform }}"
          case "$PLATFORM" in
            all)     bun run build ;;
            mac)     bun run build:mac ;;
            win)     bun run build:win ;;
            linux)   bun run build:linux ;;
            android) bun run build:android ;;
          esac

      - name: Build mcpb
        shell: bash
        run: bun run build:mcpb

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: binary
          path: |
            dist/captcha-bypass-*
          retention-days: 3

      - name: Upload mcpb
        uses: actions/upload-artifact@v7
        with:
          name: mcpb
          path: dist/captcha-bypass.mcpb
          retention-days: 3

      - name: Upload models
        uses: actions/upload-artifact@v7
        with:
          name: models
          path: models/
          retention-days: 3

      - name: Upload public
        uses: actions/upload-artifact@v7
        with:
          name: public
          path: public/
          retention-days: 3

  release:
    needs: [meta, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          name: binary
          path: dist/

      - name: Download mcpb
        uses: actions/download-artifact@v8
        with:
          name: mcpb
          path: dist/

      - name: Download models
        uses: actions/download-artifact@v8
        with:
          name: models
          path: dist/

      - name: Download public
        uses: actions/download-artifact@v8
        with:
          name: public
          path: dist/

      - name: Package models
        shell: bash
        run: |
          cd dist
          mkdir -p models
          mv *.onnx *.json models/ 2>/dev/null || true
          zip -r models.zip models/
          rm -rf *.onnx *.json models/

      - name: Package public
        shell: bash
        run: |
          cd dist
          mkdir -p public
          mv favicon.ico robots.txt public/ 2>/dev/null || true
          zip -r public.zip public/
          rm -rf favicon.ico robots.txt public/

      - name: List artifacts
        run: ls -lhR dist/

      - name: Release
        uses: ncipollo/release-action@v1
        with:
          draft: true
          allowUpdates: true
          makeLatest: false
          tag: ${{ needs.meta.outputs.tag }}
          artifacts: |
            dist/captcha-bypass-*
            dist/models.zip
            dist/public.zip
            dist/captcha-bypass.mcpb
          token: ${{ secrets.GITHUB_TOKEN }}
